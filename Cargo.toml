[package]
name = "koe"
version = "0.12.0"
edition = "2021"
description = "Ubuntu voice input system powered by Whisper + AI post-processing"

[features]
default = ["gui", "vulkan"]
gui = ["dep:gtk4", "dep:libadwaita", "dep:ksni", "dep:async-channel"]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Audio capture
cpal = "0.17"

# Speech recognition - local
whisper-rs = "0.16"

# HTTP client (for OpenAI API, Claude API, Ollama) - use rustls to avoid libssl-dev
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "blocking"] }

# Global hotkey
rdev = "0.5"

# Keyboard input simulation
enigo = { version = "0.6", features = ["x11rb"] }

# X11 window info
x11rb = { version = "0.13", features = ["all-extensions"] }

# Clipboard
arboard = "3"

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"

# URL parsing
url = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# D-Bus
zbus = "5"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# CSV export
csv = "1"

# Misc
dirs = "6"
shellexpand = "3"
hound = "3.5"

# GUI (optional, behind "gui" feature)
gtk4 = { version = "0.9", features = ["v4_6"], optional = true }
libadwaita = { version = "0.7", features = ["v1_4", "gtk_v4_6"], optional = true }
ksni = { version = "0.3", optional = true }
async-channel = { version = "2", optional = true }

# Desktop portals for GNOME Wayland shortcuts and keyboard-only input
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts", "remote_desktop", "screencast", "clipboard"] }
futures-util = "0.3"

# .deb packaging (cargo deb). Built and attached to releases by .github/workflows/release.yml.
[package.metadata.deb]
maintainer = "Shuhei <23713413+shuhei0866@users.noreply.github.com>"
copyright = "2026, Shuhei"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """\
Koe is an AI voice input for Japanese speakers on Ubuntu. Press a hotkey, \
speak, and the text is transcribed by Whisper, formatted by Claude or Ollama, \
and typed into the active window. Works on GNOME Wayland through the \
standard desktop portals."""
depends = "$auto"
# Helpers Koe runs as subprocesses (not found by shared-library detection):
# xdotool/xclip/xprop for X11 input, secret-tool for API keys in the GNOME
# keyring, canberra-gtk-play for sound feedback. GNOME Wayland input uses
# portals and needs none of the X11 tools, so they are recommends.
recommends = "xdotool, xclip, x11-utils, libsecret-tools, gnome-session-canberra"
assets = [
    ["target/release/koe", "usr/bin/", "755"],
    ["data/io.github.shuhei0866.koe.desktop", "usr/share/applications/", "644"],
    ["packaging/deb/koe.service", "usr/lib/systemd/user/", "644"],
    ["packaging/deb/config.toml", "usr/share/koe/", "644"],
    ["dictionaries/*.toml", "usr/share/koe/dictionaries/", "644"],
    ["gnome-extension/koe-overlay@shuhei0866.github.io/*", "usr/share/gnome-shell/extensions/koe-overlay@shuhei0866.github.io/", "644"],
    ["README.md", "usr/share/doc/koe/", "644"],
]
